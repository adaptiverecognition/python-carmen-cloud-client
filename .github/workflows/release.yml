name: Release

# Publishes to PyPI when a version tag (e.g. v2.0.0) is pushed, using PyPI
# trusted publishing (OIDC): no PyPI token is stored in this repository.
# One-time setup on pypi.org: project carmen-cloud-client -> Publishing ->
# add a GitHub publisher: owner adaptiverecognition, repository
# python-carmen-cloud-client, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: pip install -e ".[dev]" && pytest
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
